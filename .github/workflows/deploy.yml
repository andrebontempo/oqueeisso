name: CI/CD Pipeline (Validação & Deploy)

on:
  push:
    branches:
      - main

jobs:
  code-checks:
    name: Validação de Sintaxe & Integração
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci || npm install

      - name: Checar Sintaxe do Servidor
        run: node -c src/server.js
